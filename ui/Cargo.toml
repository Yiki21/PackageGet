[package]
name = "updater"
version.workspace = true
edition.workspace = true
description.workspace = true
homepage = "https://github.com/Yiki21/PackageGet"
repository = "https://github.com/Yiki21/PackageGet"
readme = "../README.md"
default-run = "updater"
license = "MIT"


[package.metadata.generate-rpm]
summary = "Graphical interface for multiple package managers"
vendor = "Yiki21"
version = "1.0.0"
release = "1"
auto-req = "auto"
require-sh = false

[[package.metadata.generate-rpm.assets]]
source = "target/release/updater"
dest = "/usr/bin/updater"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "target/release/updater-system-helper"
dest = "/usr/lib/updater/updater-system-helper"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "../assets/linux/com.ayi.updater.policy"
dest = "/usr/share/polkit-1/actions/com.ayi.updater.policy"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "../assets/linux/com.ayi.updater.desktop"
dest = "/usr/share/applications/com.ayi.updater.desktop"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "../assets/icons/updater.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/updater.svg"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "../assets/icons/updater.png"
dest = "/usr/share/icons/hicolor/512x512/apps/updater.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "../README.md"
dest = "/usr/share/doc/updater/README.md"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "../LICENSE"
dest = "/usr/share/licenses/updater/LICENSE"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "../THIRD_PARTY_NOTICES.md"
dest = "/usr/share/licenses/updater/THIRD_PARTY_NOTICES.md"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "assets/fonts/OFL.txt"
dest = "/usr/share/licenses/updater/Geist-OFL.txt"
mode = "644"
doc = true

[package.metadata.deb]
maintainer = "Yiki21"
section = "utils"
priority = "optional"
revision = "1"
depends = "libc6, libgcc-s1, hicolor-icon-theme, policykit-1, libwayland-client0, libx11-6, libx11-xcb1, libxkbcommon0, libxkbcommon-x11-0"
extended-description = """\
Updater is a desktop GUI application built with Rust and iced.

Features:
- Detect available package managers automatically
- View installed packages and pending updates in one place
- Search, install, remove, and update packages across package managers
"""

assets = [
  ["target/release/updater", "usr/bin/updater", "755"],
  ["target/release/updater-system-helper", "usr/lib/updater/updater-system-helper", "755"],
  ["../assets/linux/com.ayi.updater.policy", "usr/share/polkit-1/actions/com.ayi.updater.policy", "644"],
  ["../assets/linux/com.ayi.updater.desktop", "usr/share/applications/com.ayi.updater.desktop", "644"],
  ["../assets/icons/updater.svg", "usr/share/icons/hicolor/scalable/apps/updater.svg", "644"],
  ["../assets/icons/updater.png", "usr/share/icons/hicolor/512x512/apps/updater.png", "644"],
  ["../README.md", "usr/share/doc/updater/README.md", "644"],
  ["../LICENSE", "usr/share/doc/updater/copyright", "644"],
  ["../THIRD_PARTY_NOTICES.md", "usr/share/doc/updater/THIRD_PARTY_NOTICES.md", "644"],
  ["assets/fonts/OFL.txt", "usr/share/doc/updater/Geist-OFL.txt", "644"],
]

[package.metadata.generate-rpm.requires]
hicolor-icon-theme = "*"
libX11 = "*"
libX11-xcb = "*"
libwayland-client = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
polkit = "*"

[[bin]]
name = "updater"

[dependencies]
chrono.workspace = true
directories-next.workspace = true
env_logger.workspace = true
futures.workspace = true
log.workspace = true
mimalloc.workspace = true
notify-rust.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
simple-icons-pack.workspace = true
tokio.workspace = true
updater_core.workspace = true
updater_manager_api.workspace = true
updater_managers.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
iced = { workspace = true, features = ["linux-theme-detection", "wayland", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
iced.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
roxmltree.workspace = true
