[package]
name = "updater"
version.workspace = true
edition.workspace = true
description.workspace = true
homepage = "https://github.com/Yiki21/PackageGet"
repository = "https://github.com/Yiki21/PackageGet"
readme = "../README.md"
default-run = "updater"
license = "MIT"


[package.metadata.generate-rpm]
summary = "Desktop GUI updater for multiple package managers"
vendor = "Yiki21"
release = "1"
auto-req = "yes"

[[package.metadata.generate-rpm.assets]]
source = "../target/release/updater"
dest = "/usr/bin/updater"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "../assets/linux/updater.desktop"
dest = "/usr/share/applications/updater.desktop"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "../assets/icons/updater.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/updater.svg"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "../assets/icons/updater.png"
dest = "/usr/share/icons/hicolor/512x512/apps/updater.png"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "../README.md"
dest = "/usr/share/doc/updater/README.md"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "assets/fonts/OFL.txt"
dest = "/usr/share/licenses/updater/Geist-OFL.txt"
mode = "644"
doc = true

[package.metadata.deb]
maintainer = "Yiki21"
section = "utils"
priority = "optional"
revision = "1"
extended-description = """\
Updater is a desktop GUI application built with Rust and iced.

Features:
- Detect available package managers automatically
- View installed packages and pending updates in one place
- Search, install, remove, and update packages across package managers
"""

assets = [
  ["../target/release/updater", "usr/bin/updater", "755"],
  ["../assets/linux/updater.desktop", "usr/share/applications/updater.desktop", "644"],
  ["../assets/icons/updater.svg", "usr/share/icons/hicolor/scalable/apps/updater.svg", "644"],
  ["../assets/icons/updater.png", "usr/share/icons/hicolor/512x512/apps/updater.png", "644"],
  ["../README.md", "usr/share/doc/updater/README.md", "644"],
  ["assets/fonts/OFL.txt", "usr/share/doc/updater/Geist-OFL.txt", "644"],
]

[[bin]]
name = "updater"

[dependencies]
directories-next.workspace = true
env_logger.workspace = true
futures.workspace = true
iced.workspace = true
log.workspace = true
mimalloc.workspace = true
notify-rust.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
updater_core.workspace = true
url.workspace = true
