[package]
name = "updater-managers"
version.workspace = true
edition.workspace = true
description = "Built-in package manager implementations for Updater."
license = "MIT"
repository = "https://github.com/Yiki21/PackageGet"

[lib]
name = "updater_managers"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
directories-next.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["query"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
updater_manager_api.workspace = true

[dev-dependencies]
tempfile.workspace = true
