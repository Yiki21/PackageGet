name: Package

on:
  push:
    branches:
      - main
    tags:
      - "Build-v*"
    paths:
      - ".github/workflows/package.yml"
      - "assets/icons/**"
      - "packaging/**"
      - "scripts/validate-release-metadata.sh"
      - "Cargo.lock"
      - "Cargo.toml"
      - "ui/Cargo.toml"
      - "ui/build.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release metadata
        run: scripts/validate-release-metadata.sh

  build-deb:
    needs: validate-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install deb packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev jq mold

      - name: Install deb packaging tool
        run: cargo install cargo-deb --version 3.7.0 --locked --no-default-features

      - name: Build release binary
        run: cargo build --release --locked -p updater

      - name: Build deb package
        run: cargo deb -p updater --no-build --no-strip --locked

      - name: Verify deb package metadata
        run: |
          package="$(find target/debian -maxdepth 1 -name '*.deb' -print -quit)"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "updater") | .version')"
          test "$(dpkg-deb -f "$package" Version)" = "${version/-/\~}-1"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}-${{ github.ref_name }}
          path: target/debian/*.deb
          if-no-files-found: error

  build-rpm:
    needs: validate-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:42

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          dnf install -y \
            clang \
            gcc \
            git \
            jq \
            mold \
            rpm-build \
          && dnf clean all

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install rpm packaging tool
        run: cargo install cargo-generate-rpm --version 0.21.0 --locked

      - name: Build release binary
        run: cargo build --release --locked -p updater

      - name: Build rpm package
        run: cargo generate-rpm -p ui

      - name: Verify rpm package metadata
        run: |
          package="$(find target/generate-rpm -maxdepth 1 -name '*.rpm' -print -quit)"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "updater") | .version')"
          test "$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$package")" = "${version/-/\~}-1"

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.arch }}-${{ github.ref_name }}
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

  build-arch:
    needs: validate-metadata
    runs-on: ubuntu-latest
    container:
      image: quay.io/archlinux/archlinux:base-devel
    # Keep build output outside makepkg's srcdir, which --cleanbuild removes.
    env:
      CARGO_HOME: /home/builder/.cargo
      CARGO_TARGET_DIR: /home/builder/.cache/updater-target

    steps:
      - name: Install Arch packaging dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            clang \
            git \
            hicolor-icon-theme \
            jq \
            libx11 \
            libxkbcommon \
            libxkbcommon-x11 \
            mold \
            namcap \
            polkit \
            rust \
            wayland

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare tagged-layout source archive
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "updater") | .version')"
          arch_version="${version/-/}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME#Build-v}" = "$version"
          fi

          (
            source packaging/arch/PKGBUILD
            test "$pkgver" = "$arch_version"
            test "$_upstream_version" = "$version"
          )

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive \
            --format=tar \
            --prefix="PackageGet-Build-v${version}/" \
            --output="packaging/arch/updater-${arch_version}.tar" \
            "$GITHUB_SHA"
          gzip -n "packaging/arch/updater-${arch_version}.tar"

          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Cache Arch cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            /home/builder/.cargo/git
            /home/builder/.cargo/registry
            /home/builder/.cache/updater-target
          key: arch-cargo-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'packaging/arch/PKGBUILD') }}
          restore-keys: |
            arch-cargo-${{ runner.arch }}-

      - name: Prepare Arch cache ownership
        run: |
          mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR"
          chown -R builder:builder "$CARGO_HOME" "$(dirname "$CARGO_TARGET_DIR")"

      - name: Build Arch package
        working-directory: packaging/arch
        run: runuser -u builder -- makepkg --cleanbuild --noconfirm

      - name: Validate Arch package
        run: |
          mapfile -t packages < <(
            find packaging/arch -maxdepth 1 -name '*.pkg.tar.zst' -print
          )
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"

          namcap_output="$(namcap packaging/arch/PKGBUILD "$package" 2>&1)"
          printf '%s\n' "$namcap_output"
          if grep -q ' E:' <<< "$namcap_output"; then
            exit 1
          fi

          bsdtar -tf "$package" | sort > package-files.txt
          for path in \
            usr/bin/updater \
            usr/lib/updater/updater-system-helper \
            usr/share/applications/com.ayi.updater.desktop \
            usr/share/icons/hicolor/scalable/apps/updater.svg \
            usr/share/licenses/updater/LICENSE \
            usr/share/polkit-1/actions/com.ayi.updater.policy
          do
            grep -Fxq "$path" package-files.txt
          done

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v7
        with:
          name: arch-x86_64-${{ github.ref_name }}
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  build-portable-glibc:
    needs: validate-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            file-arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            file-arch: ARM aarch64

    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04

    steps:
      - name: Install portable build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            build-essential \
            clang \
            cmake \
            curl \
            desktop-file-utils \
            file \
            git \
            jq \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            mold \
            perl \
            pkg-config \
            zstd
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: portable-glibc-${{ matrix.arch }}

      - name: Build portable release binary
        run: cargo build --release --locked -p updater

      - name: Build glibc tar and AppImage
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "updater") | .version')"
          tool_dir="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tool_dir" release-artifacts

          for filename in \
            "linuxdeploy-${{ matrix.arch }}.AppImage" \
            "appimagetool-${{ matrix.arch }}.AppImage" \
            "runtime-${{ matrix.arch }}"
          do
            case "$filename" in
              linuxdeploy-*) repo=linuxdeploy/linuxdeploy ;;
              appimagetool-*) repo=AppImage/AppImageKit ;;
              runtime-*) repo=AppImage/type2-runtime ;;
            esac
            curl --fail --location --retry 5 \
              "https://github.com/$repo/releases/download/continuous/$filename" \
              --output "$tool_dir/$filename"
            expected="$(awk -v filename="$filename" '$2 == filename { print $1 }' packaging/linux/appimage-tools.sha256)"
            test -n "$expected"
            printf '%s  %s\n' "$expected" "$tool_dir/$filename" | sha256sum -c -
          done

          chmod +x \
            "$tool_dir/linuxdeploy-${{ matrix.arch }}.AppImage" \
            "$tool_dir/appimagetool-${{ matrix.arch }}.AppImage"
          packaging/linux/package-portable.sh \
            "$version" \
            "${{ matrix.arch }}" \
            glibc \
            target/release/updater \
            release-artifacts
          packaging/linux/package-appimage.sh \
            "$version" \
            "${{ matrix.arch }}" \
            target/release/updater \
            "$tool_dir/linuxdeploy-${{ matrix.arch }}.AppImage" \
            "$tool_dir/appimagetool-${{ matrix.arch }}.AppImage" \
            "$tool_dir/runtime-${{ matrix.arch }}" \
            release-artifacts

      - name: Verify glibc portable artifacts
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "updater") | .version')"
          archive="release-artifacts/updater-$version-linux-${{ matrix.arch }}-glibc.tar.gz"
          appimage="release-artifacts/updater-$version-linux-${{ matrix.arch }}.AppImage"
          extract="$RUNNER_TEMP/portable-tar"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          binary="$extract/updater-$version-linux-${{ matrix.arch }}-glibc/updater"
          file "$binary" | grep -Fq '${{ matrix.file-arch }}'
          ldd "$binary" | tee glibc-needed.txt
          if grep -Fq 'not found' glibc-needed.txt; then
            exit 1
          fi

          appimage_extract="$RUNNER_TEMP/appimage-extract"
          mkdir -p "$appimage_extract"
          (
            cd "$appimage_extract"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
            test -L squashfs-root/AppRun
            test -L squashfs-root/com.ayi.updater.desktop
            test -L squashfs-root/updater.png
            test -x squashfs-root/usr/bin/updater
            test -f squashfs-root/usr/share/metainfo/com.ayi.updater.appdata.xml
            file squashfs-root/usr/bin/updater | grep -Fq '${{ matrix.file-arch }}'
          )

      - name: Upload glibc portable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: portable-glibc-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            release-artifacts/*.tar.gz
            release-artifacts/*.AppImage
          if-no-files-found: error

  build-portable-musl:
    needs: validate-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            file-arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            file-arch: ARM aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache musl cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            .cargo-musl/git
            .cargo-musl/registry
            target-musl
          key: portable-musl-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            portable-musl-${{ matrix.arch }}-

      - name: Read release version
        id: metadata
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and package in Alpine
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            --env CARGO_HOME=/src/.cargo-musl \
            --env CARGO_TARGET_DIR=/src/target-musl \
            --env UPDATER_VERSION="${{ steps.metadata.outputs.version }}" \
            rust:1.97-alpine3.22 \
            sh -c '
              set -eu
              apk add --no-cache \
                bash \
                build-base \
                clang \
                cmake \
                dbus-dev \
                file \
                fontconfig-dev \
                freetype-dev \
                libx11-dev \
                libxcb-dev \
                libxkbcommon-dev \
                mesa-dev \
                perl \
                pkgconf \
                tar \
                wayland-dev
              cargo build --release --locked -p updater
              mkdir -p release-artifacts
              packaging/linux/package-portable.sh \
                "$UPDATER_VERSION" \
                "${{ matrix.arch }}" \
                musl \
                target-musl/release/updater \
                release-artifacts
              file target-musl/release/updater | grep -Fq "${{ matrix.file-arch }}"
              ldd target-musl/release/updater | tee musl-needed.txt
              if grep -Fq "not found" musl-needed.txt; then
                exit 1
              fi
            '

      - name: Normalize musl cache ownership
        if: always()
        run: |
          for path in .cargo-musl target-musl; do
            if [[ -e "$path" ]]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done

      - name: Upload musl portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: portable-musl-${{ matrix.arch }}-${{ github.ref_name }}
          path: release-artifacts/*-musl.tar.gz
          if-no-files-found: error

  build-windows:
    needs: validate-metadata
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Windows release binary
        run: cargo build --release --locked -p updater

      - name: Build portable archive and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'updater' |
            Select-Object -ExpandProperty version
          $numericVersion = (($version -split '[-+]')[0]) + '.0'
          $output = Join-Path $PWD 'release-artifacts'
          $portable = Join-Path $output "updater-$version-windows-x86_64"
          $binary = (Resolve-Path 'target/release/updater.exe').Path
          $icon = (Resolve-Path 'assets/icons/updater.ico').Path
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item $binary, 'LICENSE', 'README.md' -Destination $portable
          Compress-Archive -Path "$portable/*" -DestinationPath "$portable.zip"

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "/DAppVersion=$version" "/DNumericVersion=$numericVersion" "/DBinaryPath=$binary" "/DIconPath=$icon" "/DOutputDir=$output" packaging/windows/updater.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'updater' |
            Select-Object -ExpandProperty version
          $numericVersion = (($version -split '[-+]')[0]) + '.0'
          $archive = "release-artifacts/updater-$version-windows-x86_64.zip"
          $installer = "release-artifacts/updater-$version-windows-x86_64-setup.exe"
          $expanded = Join-Path $env:RUNNER_TEMP 'updater-portable'
          Expand-Archive -Path $archive -DestinationPath $expanded
          @('updater.exe', 'LICENSE', 'README.md') | ForEach-Object {
            if (-not (Test-Path (Join-Path $expanded $_))) {
              throw "portable archive is missing $_"
            }
          }
          $binaryVersion = (Get-Item (Join-Path $expanded 'updater.exe')).VersionInfo.ProductVersion
          if ($binaryVersion -ne $version) {
            throw "binary ProductVersion '$binaryVersion' does not match '$version'"
          }
          $installerVersion = (Get-Item $installer).VersionInfo.ProductVersion.Trim()
          if ($installerVersion -ne $numericVersion) {
            throw "installer ProductVersion '$installerVersion' does not match '$numericVersion'"
          }
          if ((Get-AuthenticodeSignature $installer).Status -ne 'NotSigned') {
            throw 'unsigned preview installer has an unexpected signature state'
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-${{ github.ref_name }}
          path: |
            release-artifacts/*.zip
            release-artifacts/*.exe
          if-no-files-found: error

  build-macos:
    needs: validate-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build macOS release binary
        run: cargo build --release --locked -p updater

      - name: Build app bundle and disk image
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "updater") | .version')"
          packaging/macos/package.sh \
            "$version" \
            "${{ matrix.arch }}" \
            target/release/updater \
            release-artifacts

      - name: Verify macOS artifacts
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "updater") | .version')"
          archive="release-artifacts/updater-$version-macos-${{ matrix.arch }}.app.zip"
          dmg="release-artifacts/updater-$version-macos-${{ matrix.arch }}.dmg"
          test -f "$archive"
          test -f "$dmg"
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/updater-dmg"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          test -d "$mount/Updater.app"
          test -L "$mount/Applications"
          hdiutil detach "$mount"
          trap - EXIT
          extract="$RUNNER_TEMP/updater-app"
          ditto -x -k "$archive" "$extract"
          plist="$extract/Updater.app/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = com.ayi.updater
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "$version"
          file "$extract/Updater.app/Contents/MacOS/updater" | grep -Fq '${{ matrix.arch }}'
          signature="$(codesign -dvvv "$extract/Updater.app" 2>&1 || true)"
          if grep -Fq 'Authority=Developer ID Application' <<< "$signature"; then
            echo 'unsigned preview app unexpectedly has a Developer ID signature' >&2
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-${{ github.ref_name }}
          path: |
            release-artifacts/*.app.zip
            release-artifacts/*.dmg
          if-no-files-found: error

  bundle:
    needs:
      - build-arch
      - build-deb
      - build-macos
      - build-portable-glibc
      - build-portable-musl
      - build-rpm
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate and verify checksums
        run: |
          while IFS= read -r -d '' package; do
            normalized="${package//\~/.}"
            test ! -e "$normalized"
            mv -- "$package" "$normalized"
          done < <(
            find release-artifacts -maxdepth 1 -type f -name '*~*' -print0
          )

          mapfile -t linux_packages < <(
            find release-artifacts -maxdepth 1 -type f \
              \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) \
              -printf '%f\n' \
              | sort
          )
          test "${#linux_packages[@]}" -eq 5

          mapfile -t portable_packages < <(
            find release-artifacts -maxdepth 1 -type f \
              \( -name '*-linux-*-glibc.tar.gz' -o -name '*-linux-*-musl.tar.gz' \) \
              -printf '%f\n' \
              | sort
          )
          test "${#portable_packages[@]}" -eq 4

          mapfile -t appimage_packages < <(
            find release-artifacts -maxdepth 1 -type f \
              -name '*-linux-*.AppImage' \
              -printf '%f\n' \
              | sort
          )
          test "${#appimage_packages[@]}" -eq 2

          mapfile -t windows_packages < <(
            find release-artifacts -maxdepth 1 -type f \
              \( -name '*-windows-x86_64.zip' -o -name '*-windows-x86_64-setup.exe' \) \
              -printf '%f\n' \
              | sort
          )
          test "${#windows_packages[@]}" -eq 2

          mapfile -t macos_packages < <(
            find release-artifacts -maxdepth 1 -type f \
              \( -name '*-macos-arm64.app.zip' -o -name '*-macos-arm64.dmg' \
                 -o -name '*-macos-x86_64.app.zip' -o -name '*-macos-x86_64.dmg' \) \
              -printf '%f\n' \
              | sort
          )
          test "${#macos_packages[@]}" -eq 4

          packages=(
            "${linux_packages[@]}"
            "${portable_packages[@]}"
            "${appimage_packages[@]}"
            "${windows_packages[@]}"
            "${macos_packages[@]}"
          )
          test "${#packages[@]}" -eq 17

          cd release-artifacts
          sha256sum "${packages[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7

      - name: Determine release type
        id: release
        run: |
          version="${GITHUB_REF_NAME#Build-v}"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-packages-${{ github.ref_name }}
          path: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: |
            release-artifacts/*.deb
            release-artifacts/*.dmg
            release-artifacts/*.exe
