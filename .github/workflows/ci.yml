name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, check, test, clippy, build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang jq mold

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run deterministic tests
        run: cargo test --workspace --all-targets --locked

      - name: Run Snap offline contract tests
        run: cargo test -p updater-managers --test snap_contract --locked

      - name: Run Portage and XBPS offline contract tests
        run: |
          cargo test -p updater-managers --test portage_contract --locked
          cargo test -p updater-managers --test xbps_contract --locked

      - name: Run Gentoo and Void Linux native read-only manager smokes
        run: |
          portage_test="$(
            cargo test -p updater-managers --test portage_contract --no-run \
              --locked --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .target.name == "portage_contract") | .executable // empty' \
              | tail -n 1
          )"
          xbps_test="$(
            cargo test -p updater-managers --test xbps_contract --no-run \
              --locked --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .target.name == "xbps_contract") | .executable // empty' \
              | tail -n 1
          )"
          test -x "$portage_test"
          test -x "$xbps_test"

          docker run --rm \
            -v "$(realpath "$portage_test"):/portage-contract:ro" \
            gentoo/stage3@sha256:08914e15d306bfdb251262ca3f7e3489b77ca32604ad1928cbb21dc94587261c \
            /portage-contract gentoo_container_portage_read_only_smoke \
            --ignored --exact --test-threads=1
          docker run --rm \
            -v "$(realpath "$xbps_test"):/xbps-contract:ro" \
            ghcr.io/void-linux/void-glibc-full@sha256:c6aa72cab4f7c7b1c109cb5140fd6cb6ef254c5a34037df2940942a05662bbd6 \
            /xbps-contract void_container_xbps_read_only_smoke \
            --ignored --exact --test-threads=1

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked

  portable-check:
    name: Check ${{ matrix.name }} workspace
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
          - name: macOS arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Run Windows manager offline tests
        if: runner.os == 'Windows'
        run: cargo test -p updater-managers --lib --locked

      - name: Run Scoop Windows offline contract tests
        if: runner.os == 'Windows'
        run: cargo test -p updater-managers --test scoop_contract --locked

      - name: Run Chocolatey Windows offline contract tests
        if: runner.os == 'Windows'
        run: cargo test -p updater-managers --test chocolatey_contract --locked

      - name: Run Chocolatey native read-only smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            cargo test -p updater-managers --test chocolatey_contract --locked real_chocolatey_read_only_smoke -- --ignored --exact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Chocolatey is not installed on this runner; skipping native smoke."
          }

      - name: Run optional Winget and Scoop native read-only smokes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            cargo test -p updater-managers --test winget_contract --locked real_winget_read_only_smoke -- --ignored --exact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Winget is not installed on this runner; skipping native smoke."
          }

          if (Get-Command scoop -ErrorAction SilentlyContinue) {
            cargo test -p updater-managers --test scoop_contract --locked real_scoop_read_only_smoke -- --ignored --exact
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Scoop is not installed on this runner; skipping native smoke."
          }

      - name: Run Cargo Windows offline contract tests
        if: runner.os == 'Windows'
        run: cargo test -p updater-managers --test cargo_contract --locked

      - name: Run Go Windows offline contract tests
        if: runner.os == 'Windows'
        run: cargo test -p updater-managers --test go_contract --locked

      - name: Run npm Windows offline contract tests
        if: runner.os == 'Windows'
        run: cargo test -p updater-managers --test npm_contract --locked

      - name: Run pnpm Windows offline contract tests
        if: runner.os == 'Windows'
        run: cargo test -p updater-managers --test pnpm_contract --locked

      - name: Run Bun Global offline contract tests
        run: cargo test -p updater-managers --test bun_contract --locked

      - name: Run pipx Windows offline contract tests
        if: runner.os == 'Windows'
        run: cargo test -p updater-managers --test pipx_contract --locked

      - name: Run uv tool offline contract tests
        run: cargo test -p updater-managers --test uv_contract --locked

      - name: Run .NET global tool offline contract tests
        run: cargo test -p updater-managers --test dotnet_contract --locked

      - name: Run RubyGems offline contract tests
        run: cargo test -p updater-managers --test rubygems_contract --locked

      - name: Run Composer Global offline contract tests
        run: cargo test -p updater-managers --test composer_contract --locked

      - name: Run Nix profile offline contract tests
        run: cargo test -p updater-managers --test nix_profile_contract --locked

      - name: Run Homebrew offline contract tests
        if: runner.os == 'macOS'
        run: cargo test -p updater-managers --test homebrew_contract --locked
