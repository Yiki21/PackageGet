name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, check, test, clippy, build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked --jobs 1

      - name: Run deterministic tests
        run: cargo test --workspace --all-targets --locked --jobs 1 -- --test-threads=1

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --jobs 1 -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked --jobs 1
